<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Startklar hilft beim Einstieg in erste eigene Schritte – einfach, verständlich und ohne Bürokratie." />
    <meta name="theme-color" content="#FEFAE0" />
    <title>Startklar – Erwachsenwerden, aber machbar</title>
    <script>
      // Anzeige-Einstellungen vor dem ersten Paint anwenden (kein Farb-Flash).
      try {
        var e = JSON.parse(localStorage.getItem('startklar-anzeige') || '{}')
        var dunkel = e.theme === 'dunkel' || ((e.theme || 'system') === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        var r = document.documentElement
        r.setAttribute('data-theme', dunkel ? 'dunkel' : 'hell')
        r.setAttribute('data-akzent', e.akzent || 'olive')
        r.setAttribute('data-schrift', e.schrift || 'm')
        r.setAttribute('data-motion', e.wenigerAnimation ? 'reduziert' : 'normal')
        var tc = document.querySelector('meta[name="theme-color"]')
        if (tc) tc.setAttribute('content', dunkel ? '#161C10' : '#FEFAE0')
        if (e.akzent === 'eigene' && e.eigene) {
          r.style.setProperty('--a-base', e.eigene[0])
          r.style.setProperty('--a-soft', e.eigene[1])
          r.style.setProperty('--a-deep', e.eigene[2])
          r.style.setProperty('--t-on-akzent', e.eigene[3])
        }
      } catch (err) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
