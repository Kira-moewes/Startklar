# Netlify-Konfiguration für die Ideen-App.
# Wirkt, wenn im Netlify-Site die "Base directory" auf `notizen` gesetzt ist —
# dann liest Netlify diese Datei, baut hier und veröffentlicht notizen/dist.
[build]
  command = "npm run build"
  publish = "dist"

# SPA-Fallback: alle Routen an index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
