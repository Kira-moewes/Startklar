[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Klaros KI-Modus (Opt-in): /api/agent -> Netlify Function.
# Muss VOR dem SPA-Fallback stehen.
[[redirects]]
  from = "/api/agent"
  to = "/.netlify/functions/agent"
  status = 200

# SPA-Fallback: alle Routen an index.html, damit react-router auch bei
# direktem Aufruf von Unterseiten (z. B. /termine, /vergleich/strom) greift.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
